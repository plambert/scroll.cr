name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CRYSTAL_VERSION: "1.21.0"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve version
        id: resolve
        run: |
          shard_version="$(sed -nE 's/^version:[[:space:]]*["'"'"']?([^"'"'"'[:space:]]+).*/\1/p' shard.yml)"
          [ -n "$shard_version" ] || { echo "::error::no version in shard.yml"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$shard_version" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match shard.yml version ${shard_version}"
              exit 1
            fi
          fi
          echo "version=${shard_version}" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      PKG: scroll-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Built inside the official Alpine image so --static links against musl and
      # the result runs on any Linux of this architecture.
      - name: Build
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            "crystallang/crystal:${CRYSTAL_VERSION}-alpine" \
            sh -c 'git config --global --add safe.directory /src &&
                   shards install --production --frozen &&
                   shards build scroll --release --no-debug --static'
          sudo chown -R "$(id -u):$(id -g)" bin lib

      - name: Verify
        run: |
          file bin/scroll
          file bin/scroll | grep -q 'statically linked' || {
            echo "::error::bin/scroll is not statically linked"
            exit 1
          }
          ./bin/scroll --version

      - name: Package
        run: |
          mkdir -p "dist/$PKG"
          cp bin/scroll README.md LICENSE "dist/$PKG/"
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PKG }}
          path: dist/${{ env.PKG }}.tar.gz
          if-no-files-found: error

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      PKG: scroll-${{ needs.version.outputs.version }}-darwin-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: crystal-lang/install-crystal@3a1f973b059aa96b86ada50ea29cd86b328bc0ee # v1.9.2
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}

      # macOS has no static libc, so instead we make sure the only dynamic
      # dependencies are system ones: a directory holding just the static
      # archives goes first on the library path, so the linker picks libgc.a and
      # libpcre2-8.a over the .dylib beside them, and -dead_strip_dylibs drops
      # any load command left behind.
      - name: Stage static archives
        run: |
          staticlibs="$RUNNER_TEMP/staticlibs"
          mkdir -p "$staticlibs"
          IFS=: read -ra libdirs <<< "$(crystal env CRYSTAL_LIBRARY_PATH)"
          for lib in libgc.a libpcre2-8.a; do
            for dir in "${libdirs[@]}"; do
              if [ -f "$dir/$lib" ]; then
                ln -sf "$dir/$lib" "$staticlibs/$lib"
                break
              fi
            done
            [ -e "$staticlibs/$lib" ] || {
              echo "::error::$lib not found on CRYSTAL_LIBRARY_PATH"
              exit 1
            }
          done
          echo "CRYSTAL_LIBRARY_PATH=$staticlibs:$(crystal env CRYSTAL_LIBRARY_PATH)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          shards install --production --frozen
          shards build scroll --release --no-debug --link-flags "-Wl,-dead_strip_dylibs"

      - name: Verify
        run: |
          otool -L bin/scroll
          if otool -L bin/scroll | tail -n +2 | awk '{print $1}' |
             grep -vE '^(/usr/lib/|/System/)'; then
            echo "::error::bin/scroll links a non-system dylib"
            exit 1
          fi
          ./bin/scroll --version

      - name: Package
        run: |
          mkdir -p "dist/$PKG"
          cp bin/scroll README.md LICENSE "dist/$PKG/"
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PKG }}
          path: dist/${{ env.PKG }}.tar.gz
          if-no-files-found: error

  release:
    needs: [version, linux, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "scroll ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag \
            $prerelease \
            dist/*.tar.gz dist/SHA256SUMS
